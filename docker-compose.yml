# Full local stack for the F&S knowledge base (NFR-5).
#
#   docker compose up            # build + start, wait for healthchecks
#   curl -s localhost:9000/api/health
#   docker compose run --rm ollama sh /init/ollama_init.sh   # pre-pull models
#
# Bring the app up against already-running host services instead (the venv
# path) by overriding FS_DSN / FS_OLLAMA_URL with the host locations, e.g.
# FS_DSN=postgresql://fiffia:fiffia@127.0.0.1:5999/fiffia_fs \
# FS_OLLAMA_URL=http://127.0.0.1:11434 docker compose up --no-build app
services:
  postgres:
    image: pgvector/pgvector:pg17        # postgres with the pgvector extension
    container_name: fiffia-postgres
    environment:
      # A dedicated bootstrap superuser; the app role (fiffia) is created by
      # docker/init_db.sql. POSTGRES_DB is intentionally unset so the init
      # script can create fiffia_fs itself without a "already exists" race.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - fiffia

  ollama:
    image: ollama/ollama:latest
    container_name: fiffia-ollama
    volumes:
      - ollama_data:/models
      - ./docker:/init:ro
    healthcheck:
      # ``ollama list`` answers only when the server is up (no model required),
      # so readiness does not depend on a (multi-gigabyte) model being pulled.
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - fiffia

  app:
    build: .
    container_name: fiffia-app
    environment:
      # Override the defaults in config/settings.yaml to reach the other
      # services over the compose network (see app/config.py env overrides).
      - FS_DSN=${FS_DSN:-postgresql://fiffia:fiffia@postgres:5432/fiffia_fs}
      - FS_OLLAMA_URL=${FS_OLLAMA_URL:-http://192.168.0.14:11434}
    ports:
      - "9000:8000"
    healthcheck:
      # ``python`` is guaranteed in the slim image; curl is not. Probe the API's
      # health route (returns 200 only when both DB and Ollama are reachable).
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\", timeout=4)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - fiffia

  webui:
    build: .
    container_name: fiffia-webui
    environment:
      # Reuse the same credentials/DSN the API service needs; the webui is the
      # same application, just the HTML-facing app (app.webui:app).
      - FS_DSN=${FS_DSN:-postgresql://fiffia:fiffia@postgres:5432/fiffia_fs}
      - WEBUI=1
      - WEBUI_PORT=8001
      - FS_OLLAMA_URL=${FS_OLLAMA_URL:-http://192.168.0.14:11434}
    ports:
      - "9001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\", timeout=4)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - fiffia

  mcp:
    build: .
    container_name: fiffia-mcp
    environment:
      # Same DSN/credentials the API and webui use; Ollama at the in-cluster
      # service (self-contained stack) rather than a host-specific IP.
      - FS_DSN=${FS_DSN:-postgresql://fiffia:fiffia@postgres:5432/fiffia_fs}
      - WEBUI=0
      - MCP=1
      - MCP_PORT=9002
      - FS_OLLAMA_URL=${FS_OLLAMA_URL:-http://ollama:11434}
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9002/api/health\", timeout=4)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - fiffia

volumes:
  postgres_data:
  ollama_data:

networks:
  fiffia:
